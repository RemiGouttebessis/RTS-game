[workspace]
resolver = "2"
members = [
    "crates/game",
    "crates/game_config",
    "crates/game_core",
    "crates/game_sim",
    "crates/game_render",
    "crates/game_ui",
    "crates/game_input",
    "crates/game_assets",
    "crates/game_save",
    "crates/game_net",
    "crates/game_worldgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bevy = "0.19.1"

# Bevy's own deps are compiled optimized even in debug builds, so iteration stays fast.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
