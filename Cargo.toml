[package]
name = "rts-game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"

# Bevy's own deps are compiled optimized even in debug builds, so iteration stays fast.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
