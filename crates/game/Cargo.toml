[package]
name = "game"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rts-game"
path = "src/main.rs"

[dependencies]
# bevy_dev_tools pulls in the in-game diagnostics overlay (DevDiagnosticsPlugin,
# debug builds only) — not part of bevy's default features.
bevy = { workspace = true, features = ["bevy_dev_tools"] }
game_config = { path = "../game_config" }
game_core = { path = "../game_core" }
game_sim = { path = "../game_sim" }
game_render = { path = "../game_render" }
game_ui = { path = "../game_ui" }
game_input = { path = "../game_input" }
game_assets = { path = "../game_assets" }
game_save = { path = "../game_save" }
